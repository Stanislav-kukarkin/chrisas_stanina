<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Семейный Hub</title>
    <script>
      // SPA redirect для GitHub Pages project site (/chrisas_stanina/)
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;

      var locationRef = window.location;
      locationRef.replace(
        locationRef.protocol +
          '//' +
          locationRef.hostname +
          (locationRef.port ? ':' + locationRef.port : '') +
          locationRef.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          locationRef.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (locationRef.search
            ? '&' + locationRef.search.slice(1).replace(/&/g, '~and~')
            : '') +
          locationRef.hash,
      );
    </script>
  </head>
  <body></body>
</html>
